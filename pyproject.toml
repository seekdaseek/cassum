[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassum"
version = "0.1.0"
description = "Buyer-side memory for agents that pay per call for data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sibyl-memory-client>=0.8.0"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["cassum"]
